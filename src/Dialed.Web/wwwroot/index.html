<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the shell use the full screen and pad for the notch and home indicator itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6F4E37" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dialed" />
    <title>Dialed</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="_content/Dialed.UI/css/tokens.css" />
    <link rel="stylesheet" href="_content/Dialed.UI/css/shell.css" />
    <link rel="stylesheet" href="_content/Dialed.UI/css/components.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<!-- Fluent UI builds light and dark brand themes from this colour (espresso brown) and follows the system mode. -->
<body data-theme-color="#6F4E37">
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
