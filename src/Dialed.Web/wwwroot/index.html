<!-- Fluent UI builds light and dark brand themes from this colour (espresso brown) and follows the system mode. -->
<body data-theme-color="#6F4E37">
    <!-- Shown until Blazor has started: a kettle blooms and pours twice into a V60 that drips into a cup, and the cup fills as the app downloads; the name says "Dialing" and becomes "Dialed" near the end (js/loading.js) (Blazor sets --blazor-load-percentage).
         Plain HTML and CSS on purpose so it appears before any .NET code runs; no words, so it needs no translation. -->
    <div id="app">
        <div class="dialed-loading" role="status" aria-label="Dialed">
            <div class="dialed-loading-brewer" aria-hidden="true">
                <svg viewBox="0 0 90 130" focusable="false">
                    <g class="dialed-loading-kettle" transform="translate(-12 0) rotate(16 30 20)">
                        <path class="dialed-loading-kettle-body" d="M12 10 h28 a6 6 0 0 1 6 6 v12 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 v-12 a6 6 0 0 1 6 -6 z" />
                        <path class="dialed-loading-kettle-body" d="M46 18 L60 14 L62 18 L46 28" />
                        <path d="M6 16 q-10 0 -10 8 q0 8 10 8" />
                        <path d="M20 10 q6 -6 12 0" />
                    </g>
                    <line class="dialed-loading-stream dialed-loading-stream-kettle" x1="50" y1="27" x2="50" y2="62" />
                    <polygon class="dialed-loading-cone" points="15,44 75,44 53,86 37,86" />
                    <path class="dialed-loading-rim" d="M12 44 H78" />
                    <line class="dialed-loading-stream" x1="45" y1="90" x2="45" y2="103" />
                    <path class="dialed-loading-cup" d="M28 100 h34 v14 a12 12 0 0 1 -12 12 h-10 a12 12 0 0 1 -12 -12 z" />
                    <path class="dialed-loading-cup-handle" d="M62 105 h3 a5 5 0 0 1 0 10 h-3" />
                </svg>
                <div class="dialed-loading-cone-fill"><div class="dialed-loading-water"></div></div>
                <div class="dialed-loading-cup-fill"><div class="dialed-loading-fill"></div></div>
            </div>
            <div class="dialed-loading-name" aria-hidden="true">
                <span class="dialed-loading-dialing">Dialing<span class="dialed-loading-dots"><i>.</i><i>.</i><i>.</i></span></span>
                <span class="dialed-loading-dialed">Dialed</span>
            </div>
            <div class="dialed-loading-percent" aria-hidden="true"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
