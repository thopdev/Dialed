name: Spike
description: A time-boxed investigation
labels: [spike]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations: { required: true }
  - type: input
    id: timebox
    attributes:
      label: Time box
      description: "At most one day unless agreed otherwise."
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: "A recommendation or ADR, not production code."
