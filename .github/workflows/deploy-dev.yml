name: Deploy dev

# Every merge to main provisions (when infra changed) and deploys the API and Functions to the dev environment.
# The steps live in deploy-azure.yml (shared with deploy-prod.yml). Signs in to Azure with OIDC (federated credential,
# no client secret). Set up once with infra/scripts/setup-github-oidc.ps1; until then this workflow skips itself.
# The dev PWA is published by web.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      provision:
        description: Run azd provision even if infra did not change
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    uses: ./.github/workflows/deploy-azure.yml
    with:
      environment: dev
      force-provision: ${{ github.event_name == 'workflow_dispatch' && inputs.provision }}
