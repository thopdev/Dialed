name: CI

# Minimal build + test for every PR and push to main.
# #21 extends this with coverage reporting, branch protection and Dependabot.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dialed.slnx

      - name: Build
        run: dotnet build Dialed.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Dialed.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
