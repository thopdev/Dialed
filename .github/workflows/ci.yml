name: CI

# Build, test and coverage for every PR and push to main.
# The job name `build-test` is the required status check on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Line coverage over Dialed.Domain, Dialed.Client, Dialed.Api and Dialed.AI.
  MINIMUM_LINE_COVERAGE: 70

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore Dialed.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build Dialed.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test --solution Dialed.slnx --configuration Release --no-build
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          --report-xunit-trx
          --coverage --coverage-output-format cobertura

      - name: Coverage report
        if: always()
        run: >
          dotnet reportgenerator
          -reports:"TestResults/**/*.cobertura.xml"
          -targetdir:coverage
          -reporttypes:"Cobertura;MarkdownSummaryGithub"
          -assemblyfilters:"+Dialed.Domain;+Dialed.Client;+Dialed.Api;+Dialed.AI"

      - name: Coverage summary
        if: always()
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Enforce minimum coverage
        run: python3 .github/scripts/check_coverage.py coverage/Cobertura.xml "$MINIMUM_LINE_COVERAGE"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults
            coverage
          if-no-files-found: ignore

  # Runs the stores that have a Cosmos DB implementation against the Linux (vNext) emulator, the one the AppHost runs.
  # Without COSMOS_CONNECTION_STRING (as in build-test) those tests skip.
  cosmos:
    runs-on: ubuntu-latest
    services:
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        ports:
          - 8081:8081
    env:
      # The emulator's well-known, public key.
      COSMOS_CONNECTION_STRING: "AccountEndpoint=http://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build tests/Dialed.Api.Tests --configuration Release

      - name: Wait for the Cosmos DB emulator
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8081/; then echo "emulator up"; exit 0; fi
            sleep 5
          done
          echo "emulator did not start"; exit 1

      - name: Test the Cosmos DB stores
        run: dotnet test --project tests/Dialed.Api.Tests --configuration Release --no-build --filter-class "*Cosmos*" --output detailed

  # Compiles and lints the Bicep templates (no Azure login needed). Runs only when infrastructure changes.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect infra changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if git diff --quiet "$base" HEAD -- infra azure.yaml 2>/dev/null; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Bicep build and lint
        if: steps.changes.outputs.changed == 'true'
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
